name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever was already running on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from packageManager in package.json.
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      # No secrets here. Every env var the site reads has a fallback, and the
      # route handlers refuse the logging fallback at runtime in production.
      - name: Build
        run: bun run build
