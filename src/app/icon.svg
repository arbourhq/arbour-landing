<!--
  Arbour app icon. Acid ground, Bottle A.

  The path, stroke width and round caps are copied verbatim from the wordmark
  in src/components/wordmark.tsx. The A is FIXED, so the only things this file
  does are place it and preserve its flat top.

  Placing it: the viewBox is the wordmark's own box scaled by 12
  (64 x 12 = 768), and the translate centres the A horizontally and drops it 7
  units below the geometric centre so an upward triangle sits optically level.

  The flat top: in the wordmark the apex is cut flat by the top edge of the
  viewBox (which starts at y=372, 11 units above the apex vertex at y=383).
  Re-framing into a 768 box loses that edge, so the cut is made explicit here
  as a clip. Without it the A grows a rounded dome it has never had.

  Square corners, no gradient, no shadow.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" width="768" height="768">
  <defs>
    <clipPath id="arbour-a-flat-top">
      <rect x="260" y="372" width="620" height="560"/>
    </clipPath>
  </defs>
  <rect width="768" height="768" fill="#C6FF3D"/>
  <g transform="translate(-213 -228)">
    <path d="M394 805 L595 383 L796 805" fill="none" stroke="#0B4030"
      stroke-width="122" stroke-linecap="round" stroke-linejoin="round"
      clip-path="url(#arbour-a-flat-top)"/>
  </g>
</svg>
